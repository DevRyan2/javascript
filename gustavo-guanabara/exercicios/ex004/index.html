<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interação JS</title>
    <style>

        * {
            font-family: Arial, Helvetica, sans-serif;
        }

        div {
            border: 1px solid black;
            width: 200px;
            height: 60px;
            padding: 20px;

            text-align: center;
            line-height: 60px;

            cursor: pointer;
        }

    </style>
</head>
<body>

    <h1>Trabalhando com dados v2.0</h1>

    <div class="clicar">

        Clique para começar

    </div>

    <p class="paragrafo">Aqui vai aparecer o resultado...</p>

    <script>

        const div = document.querySelector('.clicar')
        const paragrafo = document.querySelector('.paragrafo')

        div.addEventListener('click', clicar)

        function clicar() {

            const seuNome = window.prompt('Qual é o seu nome?')

            paragrafo.innerHTML = `Olá, <strong>${seuNome}</strong>! É um grande prazer te conhecer! \u{1F596}`
        }

    </script>
    
</body>
</html>
