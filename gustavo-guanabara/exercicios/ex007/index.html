<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Números com JS</title>
    <style>

        * {
            font-family: Arial, Helvetica, sans-serif;
        }

        div {
            border: 1px solid black;
            width: 200px;
            height: 60px;
            padding: 20px;

            text-align: center;
            line-height: 60px;

            cursor: pointer;
        }

    </style>
</head>
<body>

    <h1>Média do aluno v1.0</h1>

    <div class="clicar">

        Calcular média

    </div>

    <p class="paragrafo">O resultado vai aparecer aqui...</p>

    <script>

        const div = document.querySelector('.clicar')
        const paragrafo = document.querySelector('.paragrafo')

        // window.alert('Seja bem-vindo(a) ao meu site!')

        div.addEventListener('click', clicar)

        function clicar() {

            const nome = window.prompt('Qual é o nome do aluno? ')

            const n1 = Number(window.prompt(`Qual foi a primeira nota de ${nome}? `))
            const n2 = Number(window.prompt(`Além de ${n1}, qual foi a outra nota de ${nome}`))

            paragrafo.innerHTML = `Calculando a média final de <mark>${nome}</mark>. <br>`

            paragrafo.innerHTML += `As notas obtidas foram <mark>${n1} e ${n2}</mark>. <br>`

            paragrafo.innerHTML += `A média final será <mark>${(n1 + n2) / 2}</mark>`
        }

    </script>
    
</body>
</html>
