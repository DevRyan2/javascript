<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Números com números</title>
    <style>

        * {
            font-family: Arial, Helvetica, sans-serif;
        }

        div {
            border: 1px solid black;
            width: 200px;
            height: 60px;
            padding: 20px;

            text-align: center;
            line-height: 60px;

            cursor: pointer;
        }

    </style>
</head>
<body>

    <h1>Trabalhando com números</h1>

    <div class="clicar">

        Clique para calcular

    </div>

    <p class="paragrafo">O resultado vem aqui...</p>

    <script>

        const div = document.querySelector('.clicar')
        const paragrafo = document.querySelector('.paragrafo')

        // window.alert('Seja bem-vindo(a) ao meu site!')

        div.addEventListener('click', clicar)

        function clicar() {

            const n = Number(window.prompt('Digite um número:'))

            paragrafo.innerHTML = `O dobro de ${n} é ${n * 2} e a metade é ${n / 2}!`
        }

    </script>
    
</body>
</html>
